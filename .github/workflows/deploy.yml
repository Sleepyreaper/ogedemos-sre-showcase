name: Deploy approved fix → OGEDemos_RG

# Fires when a triage PR is merged to main. Re-runs the affected
# Bicep deployment(s) against OGEDemos_RG and closes the linked issue.

on:
  push:
    branches: [main]
    paths:
      - 'infra/scenarios/**'

permissions:
  contents: read
  issues: write
  id-token: write

# Serialize: never run two deploys against OGEDemos_RG in parallel.
concurrency:
  group: deploy-ogedemos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 for the change detection below

      - name: Azure login (Workload Identity Federation)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Detect changed scenarios
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.sha }}
        run: |
          # Empty/zero before-sha (first push, force-push, etc.) → fall back to HEAD~1
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="${AFTER_SHA}~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'infra/scenarios/*.bicep' || true)
          echo "Changed scenarios:"
          printf '%s\n' "$CHANGED" | sed 's/^/  • /'
          {
            echo 'files<<__EOF__'
            printf '%s\n' "$CHANGED"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Redeploy changed scenarios
        if: steps.changes.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: |
          # Iterate safely: filenames pass through env, never template interpolation.
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            name="deploy-$(basename "$file" .bicep)-$(date +%s)"
            echo "→ Deploying $file as $name"
            az deployment group create \
              -g OGEDemos_RG \
              --name "$name" \
              --template-file "$file" \
              --query "properties.provisioningState" -o tsv
          done <<<"$CHANGED_FILES"

      - name: Close linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="${AFTER_SHA}~1"
          fi
          COMMITS=$(git log "$BEFORE_SHA".."$AFTER_SHA" --pretty=%B)
          for num in $(printf '%s' "$COMMITS" | grep -oE '#[0-9]+' | tr -d '#' | sort -u); do
            gh issue close "$num" --comment "Fix deployed to OGEDemos_RG by ${WORKFLOW_NAME} run ${RUN_ID}." || true
          done
