name: Issue Triage → Draft PR

# Fires when an issue is opened (typically by Azure SRE Agent, but
# any human-filed issue works too). Runs the Foundry triage agent,
# then opens a draft PR with the proposed fix for human review.

on:
  issues:
    types: [opened, labeled]

# Serialize per-issue. We do NOT cancel-in-progress: cancelling mid-push can
# leave the triage branch in an inconsistent state and clobber human edits.
concurrency:
  group: triage-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write   # required for Azure Workload Identity Federation

jobs:
  triage:
    runs-on: ubuntu-latest
    # Strict gate: only run if the 'sre-finding' label is present.
    # - opened: must already carry the label at creation time
    # - labeled: must be the 'sre-finding' label specifically (avoids re-firing
    #   on every label add by the autonomous issue-triager subagent)
    if: |
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'sre-finding'))
      || (github.event.action == 'labeled' && github.event.label.name == 'sre-finding')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the "human commits present?" check below

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install agent deps
        run: pip install -r agents/triage/requirements.txt

      - name: Azure login (Workload Identity Federation)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Persist issue payload to file
        env:
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
        run: |
          mkdir -p out
          printf '%s' "$ISSUE_JSON" > out/issue.json

      - name: Extract optional ARG query from issue body
        id: arg
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Body is read from an env var so it can never be interpreted as shell.
          # grep is told to read stdin, never a filename derived from input.
          STATE_QUERY="$(printf '%s' "$ISSUE_BODY" | grep -oP '(?<=ARG-QUERY:\s).+' | head -1 || true)"
          # Only forward whitelisted KQL: must start with a known resource-graph table.
          case "$STATE_QUERY" in
            Resources*|ResourceContainers*|SecurityResources*|HealthResources*|PolicyResources*|"") ;;
            *) echo "::warning::Rejecting non-allowlisted ARG query"; STATE_QUERY="" ;;
          esac
          {
            echo "query<<__EOQ__"
            printf '%s\n' "$STATE_QUERY"
            echo "__EOQ__"
          } >> "$GITHUB_OUTPUT"

      - name: Run triage agent
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRIAGE_MODEL: o4-mini
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          STATE_QUERY: ${{ steps.arg.outputs.query }}
        run: |
          python -m agents.triage \
            --issue-file out/issue.json \
            --out-dir out \
            --state-query "$STATE_QUERY"

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH="triage/issue-${ISSUE_NUMBER}"
          git config user.name "ogedemos-triage[bot]"
          git config user.email "triage@ogedemos.com"

          # Refuse to overwrite reviewer commits on an existing triage branch.
          if git fetch origin "$BRANCH" 2>/dev/null && git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            HUMAN=$(git log --format='%ae' "origin/$BRANCH" ^origin/main 2>/dev/null \
                    | grep -v -F 'triage@ogedemos.com' | head -1 || true)
            if [ -n "$HUMAN" ]; then
              echo "::notice::Human commits on $BRANCH detected ($HUMAN); not overwriting."
              exit 0
            fi
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          # main.py validates that proposal.json's fix.filename is a safe relative
          # path under infra/ or scripts/ — see agents/triage/main.py:_safe_patch_path.
          PATCH_FILE=$(jq -r '.fix.filename // empty' out/proposal.json)
          if [ -n "$PATCH_FILE" ]; then
            STAGED_NAME=$(jq -r '.fix.staged_basename // empty' out/proposal.json)
            [ -n "$STAGED_NAME" ] || { echo "::error::proposal.json missing staged_basename"; exit 1; }
            mkdir -p "$(dirname "$PATCH_FILE")"
            cp "out/$STAGED_NAME" "$PATCH_FILE"
            git add "$PATCH_FILE"
          fi
          git add -f out/proposal.json
          git commit -m "Triage agent proposal for #${ISSUE_NUMBER}" || echo "Nothing to commit"

          git push -u origin "$BRANCH"

          gh pr create \
            --draft \
            --title "[Triage] ${ISSUE_TITLE}" \
            --body-file out/pr-body.md \
            --base main \
            --head "$BRANCH" \
            --label "agent-proposal,needs-human-review" || {
              echo "PR may already exist for this branch; updating..."
              gh pr edit "$BRANCH" --body-file out/pr-body.md || true
            }

      - name: Link PR back to issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_URL=$(gh pr list --head "triage/issue-${ISSUE_NUMBER}" --json url --jq '.[0].url' || echo "")
          if [ -n "$PR_URL" ]; then
            gh issue comment "${ISSUE_NUMBER}" \
              --body "🤖 Triage agent has proposed a fix in $PR_URL — please review and approve/reject."
          fi
